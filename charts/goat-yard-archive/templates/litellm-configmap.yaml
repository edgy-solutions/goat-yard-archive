{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      # --- EMBEDDING MODELS ---
      # Round-robin across all Ollama nodes for redundancy. The 7900 XTX
      # matched-pair characterization (2026-06-21 evals/peter_role_smoke)
      # showed .179 and .188 produce byte-identical first-run gemma output
      # in 4 of 6 configs and similar embeddings — the same-GPU-architecture
      # property. Cross-node variance for matched hardware is below the
      # threshold that changes Weaviate hybrid retrieval. Other-architecture
      # nodes (Strix Halo) should NOT be added to this list without separate
      # determinism characterization.
{{- range .Values.litellm.ollamaNodes }}
      - model_name: qwen3-embedding
        litellm_params:
          model: ollama/qwen3-embedding:latest
          api_base: {{ . | quote }}
          keep_alive: -1
          num_ctx: 4096
{{- end }}
      # --- BAML ROUTER MODELS (Gemma 4 Edge) ---
      # Round-robin across all Ollama nodes for redundancy. seed=0 +
      # temperature=0 + num_ctx=16384 + keep_alive=-1 set explicitly to
      # achieve byte-stable output for the matched 7900 XTX pair.
      # keep_alive duplicated into extra_body because litellm historically
      # only forwards the top-level field on /api/embeddings, not /api/chat
      # — Ollama then drops it back to its 5-min default for chat models.
      # 16k context gives headroom for RepairQuote which embeds the full
      # CommentaryChunk as "source text" — long Gill verses (esp. Romans /
      # Hebrews / footnoted chunks) regularly exceed 2k.
{{- range .Values.litellm.ollamaNodes }}
      - model_name: local-router
        litellm_params:
          model: ollama/gemma4:e4b
          api_base: {{ . | quote }}
          keep_alive: -1
          num_ctx: 16384
          temperature: 0.0
          seed: 0
          extra_body:
            keep_alive: -1
            options:
              num_ctx: 16384
              temperature: 0.0
              seed: 0
{{- end }}
    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
{{- end }}
