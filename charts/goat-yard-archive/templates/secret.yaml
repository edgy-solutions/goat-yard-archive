apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goat-yard-archive.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "goat-yard-archive.name" . }}
    helm.sh/chart: {{ include "goat-yard-archive.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  # OpenRouter
  {{- if .Values.api.env.OPENROUTER_API_KEY }}
  OPENROUTER_API_KEY: {{ .Values.api.env.OPENROUTER_API_KEY | b64enc | quote }}
  {{- end }}
  {{- if .Values.api.env.OPENROUTER_API_KEY_ANON }}
  OPENROUTER_API_KEY_ANON: {{ .Values.api.env.OPENROUTER_API_KEY_ANON | b64enc | quote }}
  {{- end }}
  
  # Langfuse
  {{- if .Values.api.env.LANGFUSE_SECRET_KEY }}
  LANGFUSE_SECRET_KEY: {{ .Values.api.env.LANGFUSE_SECRET_KEY | b64enc | quote }}
  {{- end }}
  
  # Clerk
  {{- if .Values.api.auth.clerkWebhookSecret }}
  CLERK_WEBHOOK_SECRET: {{ .Values.api.auth.clerkWebhookSecret | b64enc | quote }}
  {{- end }}
  
  # Database (Optional, typically handled by Postgres chart, but useful for API)
  # Keeping this dynamic logic for connecting API to DB
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.auth.user .Values.postgres.auth.password (.Values.postgres.host | default (printf "%s-postgres" (include "goat-yard-archive.fullname" .))) .Values.postgres.auth.database | b64enc | quote }}
