{{- if .Values.cloudflared.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goat-yard-archive.fullname" . }}-cloudflared
  labels:
    app.kubernetes.io/name: {{ include "goat-yard-archive.name" . }}-cloudflared
    helm.sh/chart: {{ include "goat-yard-archive.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "goat-yard-archive.name" . }}-cloudflared
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "goat-yard-archive.name" . }}-cloudflared
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token={{ .Values.cloudflared.token }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
      {{- with .Values.cloudflared.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudflared.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
