apiVersion: v1
kind: Service
metadata:
  name: {{ include "goat-yard-archive.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "goat-yard-archive.name" . }}-postgres
    helm.sh/chart: {{ include "goat-yard-archive.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: tcp
  selector:
    app.kubernetes.io/name: {{ include "goat-yard-archive.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
