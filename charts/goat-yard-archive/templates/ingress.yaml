{{- if .Values.ingress.enabled -}}
{{- $fullName := include "goat-yard-archive.fullname" . -}}
{{- $apiServiceName := printf "%s-api" $fullName -}}
{{- $uiServiceName := printf "%s-ui" $fullName -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "goat-yard-archive.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .service "api" }}{{ $apiServiceName }}{{ else if eq .service "minio" }}{{ if $.Values.minio }}{{ if $.Values.minio.fullnameOverride }}{{ $.Values.minio.fullnameOverride }}{{ else }}{{ $.Release.Name }}-minio{{ end }}{{ else }}{{ $.Release.Name }}-minio{{ end }}{{ else }}{{ $uiServiceName }}{{ end }}
                port:
                  number: {{ if eq .service "api" }}{{ $.Values.api.service.port }}{{ else if eq .service "minio" }}{{ if $.Values.minio }}{{ if $.Values.minio.service }}{{ $.Values.minio.service.port }}{{ else }}9000{{ end }}{{ else }}9000{{ end }}{{ else }}{{ $.Values.ui.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
