# Default values for goat-yard-archive.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

vectorizer:
  # Choose either "transformers" (CPU) or "ollama" (GPU)
  # When set to ollama, this chart will deploy the Ollama pod.
  active: "ollama" 
  
  ollama:
    image: "ollama/ollama"
    tag: "latest"
    model: "qwen3-embedding"
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: "16Gi"
      requests:
        memory: "8Gi"
        cpu: "2000m"

  transformers:
    # Transformers deployment is handled natively by the Weaviate Helm chart.
    # To configure transformers, pass values-transformers-cpu.yaml during the Weaviate helm install.

ingress:
  enabled: false
  className: "" # e.g. "nginx" or "traefik". Leave empty for default class.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          service: ui # maps to frontend service
        - path: /api
          pathType: Prefix
          service: api # maps to backend service
        - path: /scans
          pathType: Prefix
          service: minio # maps to minio service (internal)
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Cloudflare Tunnel (Optional)
cloudflared:
  enabled: false
  image:
    repository: cloudflare/cloudflared
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 2
  token: "" # Set via --set cloudflared.token=...
  # Inherits global nodeSelector/tolerations if not set, or specific:
  nodeSelector: {}
  tolerations: []


api:
  enabled: true
  replicaCount: 1
  image:
    # Update this to your GitHub repository path:
    # ghcr.io/<USERNAME>/<REPO_NAME>/backend
    repository: ghcr.io/edgy-solutions/goat-yard-archive/backend
    pullPolicy: Always
    tag: "0.0.1"
  service:
    type: ClusterIP
    port: 8000
  env:
    # URL to Weaviate in the *backend* namespace
    # Format: http://<svc-name>.<namespace>.svc.cluster.local
    # Adjust 'weaviate' to your actual service name
    WEAVIATE_URL: "http://weaviate.gya-backend.svc.cluster.local"
    # GRPC Host (internal service name, no scheme)
    WEAVIATE_GRPC_HOST: "weaviate.gya-backend.svc.cluster.local"
    WEAVIATE_PORT: "80"
    WEAVIATE_GRPC_PORT: "50051"
    APP_ENV: "production"
  auth:
    clerkIssuer: "https://<your-app>.clerk.accounts.dev"
    clerkWebhookSecret: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: user
    password: password
    database: vectors
    # Optional: OpenRouter Key (set via Secrets preferably, or here for dev)
    # OPENROUTER_API_KEY: "sk-..."

ui:
  enabled: true
  replicaCount: 1
  image:
    # Update this to your GitHub repository path:
    # ghcr.io/<USERNAME>/<REPO_NAME>/frontend
    repository: ghcr.io/edgy-solutions/goat-yard-archive/frontend
    pullPolicy: Always
    tag: "0.0.1"
  service:
    type: ClusterIP
    port: 3000
  nodeSelector: {}
  tolerations: []
  auth:
    clerkPublishableKey: ""

  # Runtime Environment Variables
  env:
    VITE_POSTHOG_KEY: ""
    VITE_POSTHOG_HOST: "https://us.i.posthog.com"
    
  # Persistence for Scanned Images
  # Mounts a local volume (HostPath) or PVC to /opt/app-root/src/dist/scans
  # This avoids bundling gigabytes of images into the Docker container.
  persistence:
    enabled: false # Disabled in favor of MinIO
    
# MinIO Configuration (Bitnami Chart)
# MinIO Configuration (Official Chart)
minio:
  enabled: true
  mode: standalone # Force standalone mode
  replicas: 1      # Force 1 replica
  rootUser: "minio"
  rootPassword: "minio123"
  buckets:
     - name: scans
       policy: public # Official chart text-based policy or just creates bucket? 
       # Official chart 'buckets' config often creates buckets. 
       # 'purge: false' to keep data?
       # Let's keep it simple for now and rely on setup script if buckets key isn't standard in 5.x
  persistence:
    enabled: true
    size: 50Gi
  service:
    type: ClusterIP
    port: 9000
    name: minio # FORCE service name to be 'minio' (or 'release-minio' depending on chart logic)
  # Force name to be predictable
  fullnameOverride: "gya-minio"

litellm:
  enabled: true
  ollamaNodes:
    - "http://192.168.1.99:11434"
    - "http://192.168.1.188:11434"
  langfuse:
    publicKey: ""
    secretKey: ""
    host: "https://cloud.langfuse.com"
