# 1. PHYSICAL Separation: Only run on nodes with this label
nodeSelector: &dmzNode
  network: dmz

# 2. SECURITY Permission: Allow running on these locked-down nodes
tolerations: &dmzTol
- key: "network"
  operator: "Equal"
  value: "dmz"
  effect: "NoSchedule"

# Frontend Deployment Values
nameOverride: "gya-frontend"
fullnameOverride: "gya-frontend"

imagePullSecrets:
  - name: ghcr-secret

api:
  enabled: true
  replicaCount: 1
  image:
    # Update this to your GitHub repository path:
    # ghcr.io/<USERNAME>/<REPO_NAME>/backend
    repository: ghcr.io/edgy-solutions/goat-yard-archive/backend
    pullPolicy: Always
    # The 0.3.3 backend artefact: CI run 39168013081 (docs/releases/0.3.3.md),
    # the exact image the paired gate run scored on gya-test, flag ON arm
    # included. digest WINS over tag, so the tag below is inert while this is
    # set and cannot defeat the pin; it is kept only as the fallback for a
    # deliberate un-pin. `:latest` is never a deploy target (ruling 2026-10-18).
    digest: "sha256:2fce1e3467d5f53e4f0700cdd51530db86cc85c8ef7231f091c6e69509b11433"
    tag: "0.3.2"
  service:
    type: ClusterIP
    port: 8000
  # Apply DMZ Isolation to MinIO
  nodeSelector: *dmzNode
  tolerations: *dmzTol
  env:
    # URL to Weaviate in the *backend* namespace
    # Format: http://<svc-name>.<namespace>.svc.cluster.local
    # Adjust 'weaviate' to your actual service name
    WEAVIATE_URL: "http://weaviate.gya-backend.svc.cluster.local"
    # GRPC Host (internal service name, no scheme)
    WEAVIATE_GRPC_HOST: "weaviate-grpc.gya-backend.svc.cluster.local"
    WEAVIATE_PORT: "80"
    WEAVIATE_GRPC_PORT: "50051"
    APP_ENV: "production"
    MINIO_HTTP_ENDPOINT: "http://gya-frontend-minio.gya-frontend.svc.cluster.local:9000"
    
    # EXTERNAL APIS (Now mapped to ConfigMap and Secret via envFrom)
    # Provide placeholders here. Override these via 'helm install --set api.env.OPENROUTER_API_KEY=...' 
    # or by providing a custom values.yaml during deployment.
    OPENROUTER_API_KEY: ""
    OPENROUTER_API_KEY_ANON: ""
    LANGFUSE_BASE_URL: "https://cloud.langfuse.com"
    LANGFUSE_SECRET_KEY: ""
    LANGFUSE_PUBLIC_KEY: ""

    # ADR-0009 typed GillAnswer ON in production (ruling, Chris 2026-11-01).
    # Flip evidence is the paired gate run, docs/audits/
    # GATE_RUN_RESULTS_structured_answer_laneA_20261026.md: PASS by the
    # pre-registered RATCHET (0 STABLE-PASS -> STABLE-FAIL, 0 must_not_cite),
    # NOT by a measured quality gain -- the effect clause abstained and that
    # report's "not a win" decomposition stands.
    #
    # NOT a live toggle: envFrom is read at container start, and
    # templates/api-deployment.yaml carries no checksum/config annotation, so a
    # config-only upgrade updates this key WITHOUT restarting the api pod. The
    # flag lands only when the pod spec also changes (here: the digest above).
    GILL_STRUCTURED_ANSWER: "1"
  
  auth:
    # Clerk configuration (Now mapped to ConfigMap and Secret)
    clerkIssuer: "https://striking-calf-57.clerk.accounts.dev"
    clerkWebhookSecret: ""

postgres:
  enabled: false
  # Since Postgres is in 'gya-backend' namespace:
  # Host: <service-name>.<namespace>.svc.cluster.local
  host: "gya-backend-postgres.gya-backend.svc.cluster.local"

# MinIO Configuration (Official Chart)
minio:
  enabled: true
  mode: standalone # Force standalone mode
  replicas: 1      # Force 1 replica
  rootUser: "minio"
  rootPassword: "minio123"
  # Apply DMZ Isolation to MinIO
  nodeSelector: *dmzNode
  tolerations: *dmzTol
  buckets:
     - name: scans
       policy: public # Official chart text-based policy or just creates bucket? 
       # Official chart 'buckets' config often creates buckets. 
       # 'purge: false' to keep data?
  persistence:
    enabled: true
    size: 50Gi
  service:
    # LoadBalancer so the offline launchpad can run the Weaviate-backup mirror
    # (mc test_minio -> prod_minio) without an in-cluster Job. MetalLB assigns
    # 192.168.1.56 from the 192.168.1.50-99 pool.
    type: LoadBalancer
    port: 9000
    name: minio # FORCE service name to be 'minio' (or 'release-minio' depending on chart logic)
  # Force name to be predictable
  fullnameOverride: "gya-frontend-minio"

ui:
  enabled: true
  replicaCount: 1
  image:
    # Update this to your GitHub repository path:
    # ghcr.io/<USERNAME>/<REPO_NAME>/frontend
    repository: ghcr.io/edgy-solutions/goat-yard-archive/frontend
    pullPolicy: Always
    # The frontend half of the gya-test pairing (values-test.yaml:46), recorded
    # there as the digest gya-test IS SERVING. Labelled honestly: as-running,
    # and this lane has NOT established it is CI-built, so it does not yet meet
    # ruling 2's CI-built-images-only clause as a verified claim. Pinning it is
    # still strictly better than the floating tag it replaces -- a pin records
    # what runs, where a tag can be re-pointed afterwards.
    digest: "sha256:f386254ee465b77ceee57b3f11ad8f1742e8f6d671e1fa71452aa819c1996da4"
    tag: "0.3.0"
  service:
    type: ClusterIP
    port: 3000
  auth:
    clerkPublishableKey: ""
  
  # 1. PHYSICAL Separation: Only run on nodes with this label
  nodeSelector: *dmzNode
  
  # 2. SECURITY Permission: Allow running on these locked-down nodes
  tolerations: *dmzTol

  # Runtime Environment Variables
  env:
    VITE_POSTHOG_KEY: ""
    VITE_POSTHOG_HOST: "https://us.i.posthog.com"

ingress:
  enabled: true
  hosts:
    - host:  goatyardarchive.org  # or your domain / LoadBalancer IP
      paths:
        - path: /
          pathType: Prefix
          service: ui
        - path: /api
          pathType: Prefix
          service: api
        - path: /scans
          pathType: Prefix
          service: minio # maps to minio service (internal)

  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Cloudflare Tunnel
cloudflared:
  enabled: true
  replicaCount: 2
  token: "" # Override via command line
  
  # Apply DMZ Isolation
  nodeSelector: *dmzNode
  tolerations: *dmzTol
