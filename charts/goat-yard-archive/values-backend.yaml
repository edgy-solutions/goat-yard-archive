# Backend Deployment Values
nameOverride: "gya-backend"
fullnameOverride: "gya-backend"

api:
  enabled: false

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    user: user
    password: password
    database: vectors
    # Optional: OpenRouter Key (set via Secrets preferably, or here for dev)
    # OPENROUTER_API_KEY: "sk-..."

ui:
  enabled: false

minio:
  enabled: false

litellm:
  enabled: false

ingress:
  enabled: false
