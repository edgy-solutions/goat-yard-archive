# values-test.yaml
# Overrides for Test Environment Deployment

# 1. API Configuration
api:
  env:
    APP_ENV: "development"
    # Point to Weaviate in gya-test namespace
    WEAVIATE_URL: "http://weaviate.gya-test.svc.cluster.local"
    # GRPC Host (internal service name, no scheme)
    WEAVIATE_GRPC_HOST: "weaviate-grpc.gya-test.svc.cluster.local"
    # Point to MinIO in gya-test namespace.
    # Service name is gya-frontend-minio per fullnameOverride in values-frontend.yaml.
    # (Previous comment said gya-minio — that was incorrect and the wrong DNS
    # name was returning 404 from the backend.)
    MINIO_HTTP_ENDPOINT: "http://gya-frontend-minio.gya-test.svc.cluster.local:9000"
    # Per-stage debug captures ON here: evals/determinism_harness.py needs them,
    # and this is the namespace it is pointed at. Production stays "0" in
    # values.yaml. Anyone who can reach this backend can read the bot's unshown
    # work for their own query -- that is the trade this namespace accepts.
    GYA_DEBUG_STAGES: "1"
  
  image:
    tag: "latest"
    
ui:
  image:
    tag: "latest"

# 2. Postgres Configuration
postgres:
  # Point to Postgres in gya-test namespace
  # Service name is gya-backend-postgres due to fullnameOverride in values-backend.yaml
  host: "gya-backend-postgres.gya-test.svc.cluster.local"

# 3. Disable Production Features
# Disable Cloudflared tunnel to avoid conflicts (requires unique token)
cloudflared:
  enabled: false

# 4. Ingress Configuration
ingress:
  enabled: true
  className: "" # Assuming nginx, adjust if using traefik or other
  hosts:
    - host: test.chart-example.local
      paths:
        - path: /
          pathType: Prefix
          service: ui
        - path: /api
          pathType: Prefix
          service: api
        - path: /scans
          pathType: Prefix
          service: minio
