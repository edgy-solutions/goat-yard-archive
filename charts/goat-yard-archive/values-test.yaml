# values-test.yaml
# Overrides for Test Environment Deployment

# 1. API Configuration
api:
  env:
    APP_ENV: "development"
    # Point to Weaviate in gya-test namespace
    WEAVIATE_URL: "http://weaviate.gya-test.svc.cluster.local"
    # GRPC Host (internal service name, no scheme)
    WEAVIATE_GRPC_HOST: "weaviate-grpc.gya-test.svc.cluster.local"
    # Point to MinIO in gya-test namespace.
    # Service name is gya-frontend-minio per fullnameOverride in values-frontend.yaml.
    # (Previous comment said gya-minio — that was incorrect and the wrong DNS
    # name was returning 404 from the backend.)
    MINIO_HTTP_ENDPOINT: "http://gya-frontend-minio.gya-test.svc.cluster.local:9000"
    # Per-stage debug captures ON here: evals/determinism_harness.py needs them,
    # and this is the namespace it is pointed at. Production stays "0" in
    # values.yaml. Anyone who can reach this backend can read the bot's unshown
    # work for their own query -- that is the trade this namespace accepts.
    GYA_DEBUG_STAGES: "1"
  
    # ADR-0009 structured answer path ON for the one-week gya-test soak
    # (ruling, Chris 2026-10-11). Production stays "0" in values.yaml until the
    # release after 0.3.2, and only if the paired gate holds -- with one replicate
    # pair the gate's EFFECT clause abstains, so the RATCHET decides that flip.
    GILL_STRUCTURED_ANSWER: "1"

  image:
    # Pinned to the exact 0.3.3 artefact smoked here on 2026-10-18
    # (docs/releases/0.3.3.md). digest WINS over tag, so the tag below is inert
    # while this is set; it is kept only as the fallback for a deliberate un-pin.
    # `:latest` is never a deploy target again (ruling, Chris 2026-10-18).
    digest: "sha256:2fce1e3467d5f53e4f0700cdd51530db86cc85c8ef7231f091c6e69509b11433"
    tag: "latest"
    
ui:
  image:
    # The frontend digest gya-test is ACTUALLY serving, read 2026-10-25.
    # Labelled honestly: as-running, NOT smoked as a release artefact.
    # 0.3.3 smoked the backend; this only records what the ui pod
    # resolved, so a helm upgrade stops moving it silently. Pinning
    # records what runs; the paired 0.3.3 gate run is what verifies it.
    # digest WINS over tag, so the tag below is inert while this is set.
    digest: "sha256:f386254ee465b77ceee57b3f11ad8f1742e8f6d671e1fa71452aa819c1996da4"
    tag: "latest"

# 2. Postgres Configuration
postgres:
  # Point to Postgres in gya-test namespace
  # Service name is gya-backend-postgres due to fullnameOverride in values-backend.yaml
  host: "gya-backend-postgres.gya-test.svc.cluster.local"

# 3. Disable Production Features
# Disable Cloudflared tunnel to avoid conflicts (requires unique token)
cloudflared:
  enabled: false

# 4. Ingress Configuration
ingress:
  enabled: true
  className: "" # Assuming nginx, adjust if using traefik or other
  hosts:
    - host: test.chart-example.local
      paths:
        - path: /
          pathType: Prefix
          service: ui
        - path: /api
          pathType: Prefix
          service: api
        - path: /scans
          pathType: Prefix
          service: minio
